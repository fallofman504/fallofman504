; Optional: lets you build SimpleLamp from the command line (pio run).
; The Arduino IDE does not need this file.
[platformio]
src_dir = SimpleLamp

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit NeoPixel@^1.15.1
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
